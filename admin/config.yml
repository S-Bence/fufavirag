                field: {label: Fotó, name: image, widget: image}
              - {label: Megjelenítési sorrend (0 = legelső), name: order, widget: number, value_type: int, min: 0, default: 0}
              - {label: Közzétéve, name: published, widget: boolean, default: false}
              - label: Szezon
