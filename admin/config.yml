            fields:
              - {label: Azonosító, name: id, widget: string, required: false}
              - {label: Név, name: title, widget: string}
              - {label: Leírás, name: description, widget: text, required: false}
              - {label: Főkép, name: image, widget: image}
              - label: További képek
                name: extra_images
                widget: list
