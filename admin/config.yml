# Fű-Fa-Virág – Decap CMS konfiguráció
# GitHub OAuth hitelesítés Cloudflare Worker segítségével

backend:
  name: github
  repo: S-Bence/fufavirag
  branch: develop
  base_url: https://fufavirag-cms-auth-test.stremenbence83-823.workers.dev
  auth_endpoint: auth
  site_domain: fufavirag-test.pages.dev

media_folder: images/uploads
public_folder: /images/uploads
locale: hu
publish: false
collections:
  - name: content
    label: Honlap tartalmai
    files:
      - name: offers
        label: Aktuális ajánlataink
        file: content/offers.json
        fields:
          - {label: Szekció megjelenítése, name: visible, widget: boolean, default: true}
          - {label: Kis felirat, name: eyebrow, widget: string, default: Virágok minden évszakban}
          - {label: Szekció címe, name: heading, widget: string, default: Aktuális ajánlataink}
          - {label: Alcím, name: subtitle, widget: text, required: false}
          - label: Ajánlatok
            name: items
            widget: list
            required: false
            summary: '{{fields.title}}'
            fields:
              - {label: Cím, name: title, widget: string}
              - {label: Leírás, name: description, widget: text}
              - {label: Fotó, name: image, widget: image, required: false}
              - {label: Közzétéve, name: published, widget: boolean, default: false}
      - name: gallery
        label: Galéria
        file: content/gallery.json
        fields:
          - label: Fotók
            name: items
            widget: list
            summary: '{{fields.alt}}'
            fields:
              - {label: Fotó, name: image, widget: image}
              - {label: Képleírás, name: alt, widget: string}
      - name: products_viragcsokrok
        label: Virágcsokrok – termékek
        file: content/products-viragcsokrok.json
        fields:
          - label: Termékek
            name: items
            widget: list
            required: false
            summary: '{{fields.title}}'
            fields:
              - {label: Azonosító, name: id, widget: string, required: false}
              - {label: Név, name: title, widget: string}
              - {label: Leírás, name: description, widget: text, required: false}
              - {label: Főkép, name: image, widget: image}
              - label: További képek
                name: extra_images
                widget: list
                required: false
                field: {label: Fotó, name: image, widget: image}
              - {label: Megjelenítési sorrend (0 = legelső), name: order, widget: number, value_type: int, min: 0, default: 0}
              - {label: Közzétéve, name: published, widget: boolean, default: false}
              - label: Szezon
                name: season
                widget: select
                required: false
                default: Egész évben
                options: ['Egész évben', 'Ellenőrizendő', 'Tavasz / húsvét', 'Ősz', 'Advent / karácsony', 'Tavasz', 'Nyár', 'Tél']
              - {label: Kezdőnap (HH-NN), name: start, widget: string, required: false, pattern: ['^([0-1][0-9])-(0[1-9]|[12][0-9]|3[01])$', 'Példa: 11-15']}
              - {label: Zárónap (HH-NN), name: end, widget: string, required: false, pattern: ['^([0-1][0-9])-(0[1-9]|[12][0-9]|3[01])$', 'Példa: 12-26']}
      - name: products_novenyek
        label: Növények – termékek
        file: content/products-novenyek.json
        fields:
          - label: Termékek
            name: items
            widget: list
            required: false
            summary: '{{fields.title}}'
            fields:
              - {label: Azonosító, name: id, widget: string, required: false}
              - {label: Név, name: title, widget: string}
              - {label: Leírás, name: description, widget: text, required: false}
              - {label: Főkép, name: image, widget: image}
              - label: További képek
                name: extra_images
                widget: list
                required: false
                field: {label: Fotó, name: image, widget: image}
              - {label: Megjelenítési sorrend (0 = legelső), name: order, widget: number, value_type: int, min: 0, default: 0}
              - {label: Közzétéve, name: published, widget: boolean, default: false}
              - label: Szezon
                name: season
                widget: select
                required: false
                default: Egész évben
                options: ['Egész évben', 'Ellenőrizendő', 'Tavasz / húsvét', 'Ősz', 'Advent / karácsony', 'Tavasz', 'Nyár', 'Tél']
              - {label: Kezdőnap (HH-NN), name: start, widget: string, required: false, pattern: ['^([0-1][0-9])-(0[1-9]|[12][0-9]|3[01])$', 'Példa: 11-15']}
              - {label: Zárónap (HH-NN), name: end, widget: string, required: false, pattern: ['^([0-1][0-9])-(0[1-9]|[12][0-9]|3[01])$', 'Példa: 12-26']}
      - name: products_dekoraciok
        label: Dekorációk – termékek
        file: content/products-dekoraciok.json
