              - {label: Kezdőnap (HH-NN), name: start, widget: string, required: false, pattern: ['^([0-1][0-9])-(0[1-9]|[12][0-9]|3[01])$', 'Példa: 11-15']}
              - {label: Zárónap (HH-NN), name: end, widget: string, required: false, pattern: ['^([0-1][0-9])-(0[1-9]|[12][0-9]|3[01])$', 'Példa: 12-26']}
      - name: products_adventi_dekoraciok
        label: Adventi dekorációk – termékek
        file: content/products-adventi-dekoraciok.json
        fields:
          - label: Termékek
            name: items
            widget: list
